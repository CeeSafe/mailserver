auth_allow_cleartext = yes
# SEARCH by substring, as RFC 3501 says: no full-text index (the image indexes with stemming and stopwords).
mail_plugins {
  fts = no
  fts_flatcurve = no
}
# For tools/bench.py's idle connections: a process per IMAP connection, all of one user.
mail_max_userip_connections = 10000
default_client_limit = 10000
service imap {
  process_limit = 10000
}
